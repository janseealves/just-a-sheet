name: CI
on: [push, pull_request]
jobs:
  test:
    name: Lint & Testes
    # Nunca self-hosted em CI: o repositório é público.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest
