name: Deploy · Production
run-name: Deploy to production by @${{ github.actor }}
on:
  push:
    branches:
      - prd
  # Execução manual (Actions → Deploy → Run workflow): só simula, não faz deploy.
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    name: Build & Deploy
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, ARM64, just-a-sheet]
    steps:
      - uses: actions/checkout@v5
      - name: Build & restart
        run: |
          cp /just-a-sheet/.env .env
          docker compose -f docker-compose.yml up -d --build --remove-orphans
          docker image prune -f

  dry-run:
    name: Simulação (dry-run)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, ARM64, just-a-sheet]
    steps:
      - uses: actions/checkout@v5
      - name: Build & simulação (não grava nada, não sobe o serviço)
        run: |
          cp /just-a-sheet/.env .env
          docker compose -f docker-compose.yml build importer
          # Repositório público => log de Actions público. A saída da simulação traz
          # dados de transações, então vai para um arquivo no servidor (o redirecionamento
          # é feito pelo shell do runner, fora do container); o log só mostra o resultado.
          docker compose -f docker-compose.yml run --rm importer just-a-sheet once --dry-run > /just-a-sheet/dry-run.log 2>&1 \
            && echo "Simulação concluída. Resultado em /just-a-sheet/dry-run.log no servidor." \
            || { echo "Simulação falhou. Detalhes em /just-a-sheet/dry-run.log no servidor."; exit 1; }
