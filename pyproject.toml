[project]
name = "just-a-sheet"
version = "0.1.0"
description = "Importador de fatura Nubank e extrato Bradesco para o Google Sheets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "gspread>=6.1.4",
    "openai>=1.54.0",
    "pdfplumber>=0.11.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "tzdata>=2024.2",
]

[project.scripts]
just-a-sheet = "just_a_sheet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["just_a_sheet"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (imports não usados, variáveis indefinidas)
    "I",    # isort (ordenação de imports)
    "UP",   # pyupgrade (sintaxe moderna do Python)
    "B",    # flake8-bugbear (bugs comuns e antipadrões)
    "C4",   # flake8-comprehensions (comprehensions mais eficientes)
    "SIM",  # flake8-simplify (simplificação de código)
]
ignore = [
    "E501", # line too long — controlado pelo formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
